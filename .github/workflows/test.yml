name: Static video site
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker build -t laity-shorts:test .
      - run: docker run --rm --read-only --tmpfs /tmp:rw,nosuid,noexec,uid=101,gid=101,mode=0700 laity-shorts:test -t
      - run: docker run --detach --name shorts-test --user 12345:23456 --read-only --tmpfs /tmp:rw,nosuid,noexec,uid=12345,gid=23456,mode=0700 --cap-drop=ALL --security-opt=no-new-privileges -p 127.0.0.1:18080:8080 laity-shorts:test
      - name: Wait for local Nginx
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: python -m unittest discover -s tests -v
      - name: Verify non-root container remains running
        run: |
          test "$(docker exec shorts-test id -u)" = 12345
          test "$(docker inspect --format '{{.State.Running}}/{{.RestartCount}}' shorts-test)" = true/0
      - if: always()
        run: docker rm --force shorts-test
