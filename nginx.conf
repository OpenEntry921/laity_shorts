map $arg_v $entry {
    default index.html;
    1 video-1.html;
    2 video-2.html;
    3 video-3.html;
}
map "$uri:$arg_v" $cache_policy {
    default "no-cache";
    "~^/(videos|posters)/.+:[a-f0-9]{16}$" "public, max-age=31536000, immutable";
    ~^/.*\.html: "no-store";
    ~^/: "no-store";
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    etag on;
    access_log off;
    server_tokens off;
    add_header Cache-Control $cache_policy always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; media-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location = / {
        try_files /$entry =404;
    }
    location / {
        try_files $uri =404;
    }
}
